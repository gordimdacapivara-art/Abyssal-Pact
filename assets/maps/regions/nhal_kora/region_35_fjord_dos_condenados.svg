  <!-- PROCEDURAL TERRAIN & RELIEF -->
<g id="elevation_contours" stroke="#1b3345" stroke-width="1.2" fill="none" opacity="0.45" stroke-dasharray="8,4">
  <path d="M 180.5 650.0 Q 320.85 364.40000000000003 660.0 247.0 Q 999.15 364.40000000000003 1129.5 650.0 Q 999.15 935.5999999999999 660.0 1043.0 Q 320.85 935.5999999999999 180.5 650.0 Z"/>
  <path d="M 277.4 650.0 Q 388.68 421.52 660.0 328.6 Q 931.3199999999999 421.52 1032.6 650.0 Q 931.3199999999999 878.48 660.0 961.4 Q 388.68 878.48 277.4 650.0 Z"/>
  <path d="M 380.0 650.0 Q 460.5 482.0 660.0 415.0 Q 859.5 482.0 930.0 650.0 Q 859.5 818.0 660.0 875.0 Q 460.5 818.0 380.0 650.0 Z"/>
  <path d="M 482.6 650.0 Q 532.32 542.48 660.0 501.4 Q 787.68 542.48 827.4 650.0 Q 787.68 757.52 660.0 788.6 Q 532.32 757.52 482.6 650.0 Z"/>
</g>
<g id="river_channel" stroke="#3a6073" stroke-width="5" fill="none" opacity="0.8">
