    <rect x="82" y="162" width="1156" height="976" rx="18" fill="none" stroke="#c85a2b" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.6"/>
  </g>
  <!-- PROCEDURAL TERRAIN & RELIEF -->
<g id="elevation_contours" stroke="#3a2a1f" stroke-width="1.2" fill="none" opacity="0.45" stroke-dasharray="8,4">
  <path d="M 183.5 650.0 Q 320.85 364.40000000000003 660.0 246.0 Q 999.15 364.40000000000003 1132.5 650.0 Q 999.15 935.5999999999999 660.0 1050.0 Q 320.85 935.5999999999999 183.5 650.0 Z"/>
  <path d="M 280.4 650.0 Q 388.68 421.52 660.0 327.6 Q 931.3199999999999 421.52 1035.6 650.0 Q 931.3199999999999 878.48 660.0 968.4 Q 388.68 878.48 280.4 650.0 Z"/>
