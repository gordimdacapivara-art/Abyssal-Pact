    <circle cx="0" cy="0" r="75" fill="url(#safezone-glow)" stroke="#ffd54f" stroke-width="2" stroke-dasharray="6,4"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#ffb300" stroke-width="0.8" opacity="0.5"/>
    
    <!-- Castle / Fortress Bastion Icon -->
