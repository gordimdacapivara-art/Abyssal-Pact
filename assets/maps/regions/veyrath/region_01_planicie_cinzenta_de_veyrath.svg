<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <defs>
    <!-- Background & Vignette -->
    <radialGradient id="reg-bg-1" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a201c"/>
      <stop offset="60%" stop-color="#181311"/>
      <stop offset="100%" stop-color="#0d0908"/>
    </radialGradient>

    <radialGradient id="territory-fill-1" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#382a24"/>
      <stop offset="70%" stop-color="#261c18"/>
      <stop offset="100%" stop-color="#120d0b"/>
    </radialGradient>

    <radialGradient id="safezone-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd54f" stop-opacity="0.25"/>
      <stop offset="75%" stop-color="#ffb300" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff8f00" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="boss-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e53935" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#b71c1c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7f0000" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- CANVAS BACKGROUND -->
  <rect x="0" y="0" width="1600" height="1200" fill="url(#reg-bg-1)"/>

  <!-- TERRITORY BASE & FRONTIER POLYGON -->
  <g id="territory_ground" filter="url(#shadow)">
    <!-- Organic Frontier Boundary Line -->
    <rect x="70" y="150" width="1180" height="1000" rx="24" fill="url(#territory-fill-1)" stroke="#c85a2b" stroke-width="3.5"/>
    <rect x="82" y="162" width="1156" height="976" rx="18" fill="none" stroke="#c85a2b" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.6"/>
  </g>
  <!-- PROCEDURAL TERRAIN & RELIEF -->
<g id="elevation_contours" stroke="#3a2a1f" stroke-width="1.2" fill="none" opacity="0.45" stroke-dasharray="8,4">
  <path d="M 182.5 650.0 Q 320.85 364.40000000000003 660.0 253.0 Q 999.15 364.40000000000003 1131.5 650.0 Q 999.15 935.5999999999999 660.0 1041.0 Q 320.85 935.5999999999999 182.5 650.0 Z"/>
  <path d="M 279.4 650.0 Q 388.68 421.52 660.0 334.6 Q 931.3199999999999 421.52 1034.6 650.0 Q 931.3199999999999 878.48 660.0 959.4 Q 388.68 878.48 279.4 650.0 Z"/>
  <path d="M 382.0 650.0 Q 460.5 482.0 660.0 421.0 Q 859.5 482.0 932.0 650.0 Q 859.5 818.0 660.0 873.0 Q 460.5 818.0 382.0 650.0 Z"/>
  <path d="M 484.6 650.0 Q 532.32 542.48 660.0 507.4 Q 787.68 542.48 829.4 650.0 Q 787.68 757.52 660.0 786.6 Q 532.32 757.52 484.6 650.0 Z"/>
</g>
  <!-- CITY & SAFE ZONE: Baluarte das Cinzas -->
  <g id="poi_city" transform="translate(527.0, 621.0)" filter="url(#shadow)">
    <!-- Safe Zone Perimeter Ring (25m radius) -->
    <circle cx="0" cy="0" r="75" fill="url(#safezone-glow)" stroke="#ffd54f" stroke-width="2" stroke-dasharray="6,4"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#ffb300" stroke-width="0.8" opacity="0.5"/>
    
    <!-- Castle / Fortress Bastion Icon -->
    <rect x="-24" y="-18" width="48" height="36" rx="3" fill="#241a14" stroke="#d4af37" stroke-width="2"/>
    <polygon points="-24,-18 -16,-28 -8,-18 0,-28 8,-18 16,-28 24,-18" fill="#d4af37"/>
    <rect x="-8" y="2" width="16" height="16" fill="#140d09" stroke="#d4af37" stroke-width="1"/>
    
    <!-- City Label -->
    <rect x="-105" y="26" width="210" height="24" rx="4" fill="#140f0c" stroke="#d4af37" stroke-width="1.2"/>
    <text x="0" y="42" text-anchor="middle" font-family="'Trajan Pro', 'Georgia', serif" font-size="11" font-weight="bold" fill="#ffe082">Baluarte das Cinzas</text>
    <text x="0" y="60" text-anchor="middle" font-family="'Georgia', serif" font-size="8.5" fill="#a89278">Zona Segura • Sem Dano Hostil (Raio 25m)</text>
  </g>
  <!-- DUNGEON ENTRANCE: Catacumbas de Basalto -->
  <g id="poi_dungeon" transform="translate(807.0, 517.0)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="32" fill="#1a1111" stroke="#d32f2f" stroke-width="2"/>
    <!-- Cave Arch / Skull Gate -->
    <path d="M -16 12 C -16 -16 16 -16 16 12 Z" fill="#0d0505" stroke="#ff5252" stroke-width="1.5"/>
    <polygon points="-6,-6 0,-14 6,-6" fill="#ff5252"/>
    
    <!-- Label -->
    <rect x="-115" y="20" width="230" height="24" rx="4" fill="#140808" stroke="#d32f2f" stroke-width="1.2"/>
    <text x="0" y="36" text-anchor="middle" font-family="'Trajan Pro', 'Georgia', serif" font-size="10" font-weight="bold" fill="#ff8a80">🏰 Catacumbas de Basalto</text>
    <text x="0" y="54" text-anchor="middle" font-family="'Georgia', serif" font-size="8.5" fill="#e57373">Entrada de Masmorra • Nível 1+</text>
  </g>
  <!-- BOSS ARENA: BOSS-001 -->
  <g id="poi_boss_arena" transform="translate(845.0, 781.0)" filter="url(#shadow)">
